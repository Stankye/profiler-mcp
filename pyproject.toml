[project]
name = "profiler-mcp"
version = "0.1.0"
description = "MCP servers for Intel VTune Profiler and AMD uProf, with mock backends for hardware-free self-testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "profiler-mcp contributors" }]
keywords = ["mcp", "profiling", "vtune", "uprof", "performance"]
dependencies = [
    "mcp>=1.28,<2",
]

[project.scripts]
vtune-mcp = "profiler_mcp.vtune.server:main"
uprof-mcp = "profiler_mcp.uprof.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profiler_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
